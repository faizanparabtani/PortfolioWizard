{% extends 'theme/base.html' %}
{% block title %}Edit {{ portfolio.title }} - PortfolioWizard{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
<style>
  .CodeMirror { height: 100%; font-size: 13px; }
  .editor-wrap { height: calc(100vh - 220px); min-height: 400px; }
</style>
{% endblock %}

{% block content %}
<div class="max-w-full px-4 sm:px-6 py-6">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
    <h1 class="text-2xl font-bold text-white flex items-center gap-2">
      <i class="fas fa-code text-indigo-400"></i> Edit Portfolio
    </h1>
    <div class="flex gap-3">
      <label class="flex items-center gap-2 text-sm text-gray-300 cursor-pointer">
        <input type="checkbox" id="autoUpdate" checked class="accent-indigo-500">
        Auto-preview
      </label>
      <a href="{% url 'generator:view_portfolio' portfolio.id %}"
         class="inline-flex items-center gap-2 px-4 py-2 border border-white/20 text-gray-200 rounded-lg hover:bg-white/10 transition text-sm">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </div>
  </div>

  <form method="post" id="editForm">
    {% csrf_token %}

    <!-- Editor + Preview: stacked on mobile, side-by-side on desktop -->
    <div class="flex flex-col lg:flex-row gap-4 editor-wrap">

      <!-- Editor panel -->
      <div class="flex-1 flex flex-col min-w-0">
        <p class="text-xs text-gray-500 mb-1 uppercase tracking-wide font-medium">HTML Editor</p>
        <div class="flex-1 border border-white/10 rounded-xl overflow-hidden">
          <textarea id="htmlEditor" name="html_content" class="hidden">{{ html_content }}</textarea>
        </div>
      </div>

      <!-- Preview panel -->
      <div class="flex-[1.5] flex flex-col min-w-0">
        <p class="text-xs text-gray-500 mb-1 uppercase tracking-wide font-medium">Live Preview</p>
        <div class="flex-1 border border-white/10 rounded-xl overflow-hidden relative bg-white">
          <div id="previewOverlay"
               class="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 transition-opacity pointer-events-none">
            <div class="animate-spin rounded-full h-6 w-6 border-t-2 border-indigo-400"></div>
          </div>
          <iframe id="previewFrame" class="w-full h-full border-0"
                  srcdoc="{{ html_content|escapejs }}"></iframe>
        </div>
      </div>

    </div>

    <!-- Actions -->
    <div class="flex gap-3 mt-4">
      <button type="submit"
              class="inline-flex items-center gap-2 px-5 py-2.5 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl font-medium transition">
        <i class="fas fa-save"></i> Save Changes
      </button>
      <button type="button" onclick="window.location.reload()"
              class="inline-flex items-center gap-2 px-5 py-2.5 border border-white/20 text-gray-200 rounded-xl hover:bg-white/10 transition">
        <i class="fas fa-undo"></i> Discard
      </button>
    </div>
  </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/htmlmixed/htmlmixed.min.js"></script>
<script>
  const editor = CodeMirror.fromTextArea(document.getElementById('htmlEditor'), {
    mode: 'htmlmixed',
    theme: 'monokai',
    lineNumbers: true,
    autoCloseTags: true,
    matchBrackets: true,
    indentUnit: 2,
    lineWrapping: true,
  });

  // Make CodeMirror fill its container
  editor.setSize('100%', '100%');

  const previewFrame   = document.getElementById('previewFrame');
  const previewOverlay = document.getElementById('previewOverlay');
  const autoUpdate     = document.getElementById('autoUpdate');
  let debounce;

  editor.on('change', () => {
    if (!autoUpdate.checked) return;
    clearTimeout(debounce);
    previewOverlay.style.opacity = '1';
    debounce = setTimeout(() => {
      previewFrame.srcdoc = editor.getValue();
      setTimeout(() => { previewOverlay.style.opacity = '0'; }, 300);
    }, 600);
  });
</script>
{% endblock %}
