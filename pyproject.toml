[project]
name = "portfoliowizard"
version = "0.1.0"
description = "AI-powered portfolio generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "anthropic>=0.40",
    "PyPDF2>=3.0.1",
    "beautifulsoup4>=4.14",
    "python-dotenv>=1.1",
    "django-tailwind>=4.2",
    "django-browser-reload>=1.21",
    "django-cors-headers>=4.9",
    "pillow>=11.2",
    "requests>=2.32",
    "whitenoise>=6.11",
    "gunicorn>=23.0",
    "dj-database-url>=2.3",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "portfolio_site_generator.settings.development"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
